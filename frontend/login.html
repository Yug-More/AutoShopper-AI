<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delivry – Log In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --green: #10B981;
      --green-light: #34D399;
      --green-soft: #ECFDF5;
      --green-muted: #A7F3D0;
      --text-dark: #0F172A;
      --text-light: #64748B;
      --border: #E2E8F0;
      --bg-grey: #F8FAFC;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #F9FAFB 0, #FFFFFF 40%, #F1F5F9 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: fadeInBody 0.4s ease-out forwards;
    }

    @keyframes fadeInBody {
      to { opacity: 1; }
    }

    /* NAVBAR (matches index.html) */
    .navbar {
      width: 100%;
      padding: 14px 34px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #FFFFFF, var(--green));
      box-shadow: 0 0 10px rgba(16,185,129,0.6);
      animation: logoPulse 2s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      color: var(--text-light);
    }

    .nav-pill {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--bg-grey);
      border: 1px solid #E5E7EB;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-light);
    }

    .nav-link {
      font-size: 13px;
      color: var(--green);
      cursor: pointer;
      font-weight: 600;
      border: none;
      background: none;
      text-decoration: none;
    }

    .nav-link:hover {
      text-decoration: underline;
    }

    /* AUTH LAYOUT */
    .auth-shell {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 20px 40px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 30px rgba(148,163,184,0.18);
      padding: 26px 26px 24px;
      position: relative;
      overflow: hidden;
      animation: slideUpCard 0.35s ease-out;
    }

    .auth-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at top left, rgba(52,211,153,0.18), transparent 55%);
      opacity: 0.8;
    }

    .auth-card > * {
      position: relative;
      z-index: 1;
    }

    @keyframes slideUpCard {
      from { opacity: 0; transform: translateY(10px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-orb {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #FFFFFF, var(--green));
      box-shadow: 0 0 18px rgba(16,185,129,0.7);
      margin-bottom: 16px;
      animation: logoPulse 2.1s ease-in-out infinite;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .sub {
      color: var(--text-light);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .security-note {
      font-size: 12px;
      color: #6B7280;
      background: #F9FAFB;
      border-radius: 12px;
      border: 1px dashed #E5E7EB;
      padding: 8px 10px;
      margin-bottom: 16px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      display: block;
    }

    .input-field {
      width: 100%;
      padding: 11px 13px;
      font-size: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-grey);
      outline: none;
      margin-bottom: 14px;
      transition: border 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, transform 0.06s ease;
    }

    .input-field:focus {
      border-color: var(--green);
      background: var(--white);
      box-shadow: 0 0 0 2px rgba(16,185,129,0.16);
      transform: translateY(-0.5px);
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--green), var(--green-light));
      color: var(--white);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(16,185,129,0.45);
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      transition: transform 0.1s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 32px rgba(16,185,129,0.55);
      filter: brightness(1.02);
    }

    .btn-icon {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 2px solid #FFFFFF;
      background: rgba(16,185,129,0.85);
    }

    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      color: #6B7280;
    }

    .footer a {
      color: var(--green);
      font-weight: 600;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .error-msg {
      margin-top: 10px;
      font-size: 13px;
      color: #B91C1C;
      background: #FEE2E2;
      border-radius: 10px;
      padding: 9px 10px;
      border: 1px solid #FCA5A5;
    }

    @media (max-width: 600px) {
      .navbar {
        padding: 12px 16px;
      }
      .auth-card {
        padding: 22px 18px 20px;
      }
    }
  </style>
</head>

<body>
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="brand">
      <div class="brand-logo"></div>
      DELIVRY
    </div>
    <div class="nav-right">
      <div class="nav-pill">Allergy-aware • Privacy-first</div>
      <a href="signup.html" class="nav-link">Create account</a>
    </div>
  </header>

  <!-- AUTH CARD -->
  <main class="auth-shell">
    <section class="auth-card">
      <div class="logo-orb"></div>
      <h1>Welcome back</h1>
      <div class="sub">Log in to access your allergy-safe ordering agent.</div>

      <div class="security-note">
        We only use this profile locally in your browser to apply your allergies and rules.  
        No payment or sensitive data is processed by Delivry.
      </div>

      <label for="email">Email</label>
      <input id="email" class="input-field" placeholder="you@example.com" />

      <label for="password">Password</label>
      <input id="password" class="input-field" type="password" placeholder="••••••••" />

      <button class="btn-primary" onclick="login()">
        <span class="btn-icon"></span>
        <span>Continue to Delivry</span>
      </button>

      <div id="error" class="error-msg" style="display:none;"></div>

      <div class="footer">
        New here? <a href="signup.html">Create your profile</a>
      </div>
    </section>
  </main>

  <script>
    function showError(msg) {
      const err = document.getElementById("error");
      err.textContent = msg;
      err.style.display = "block";
    }

    function clearError() {
      const err = document.getElementById("error");
      err.textContent = "";
      err.style.display = "none";
    }

    function login() {
      clearError();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        showError("Please enter both email and password.");
        return;
      }

      const stored = localStorage.getItem("delivry_user");
      if (!stored) {
        showError("No profile found. Please create an account first.");
        return;
      }

      const user = JSON.parse(stored);

      if (user.email !== email || user.password !== password) {
        showError("Incorrect email or password. Please try again.");
        return;
      }

      window.location.href = "index.html";
    }
  </script>
</body>
</html>
