<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Delivry – Create Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      padding: 34px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
      animation: fadeUp .5s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: #10B981;
      margin-bottom: 12px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 24px;
      font-size: 14px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-top: 12px;
      margin-bottom: 6px;
      display: block;
    }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      outline: none;
      background: #ffffff;
      transition: all .15s ease;
    }

    input:focus, textarea:focus {
      border-color: #10B981;
      box-shadow: 0 0 0 2px rgba(16,185,129,0.25);
    }

    .btn {
      margin-top: 22px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #10B981;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s ease;
      box-shadow: 0 6px 18px rgba(16,185,129,.35);
    }

    .btn:hover {
      background: #0EA66B;
      transform: translateY(-1px);
    }

    .link {
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
      color: #065F46;
    }

    .link a {
      color: #059669;
      text-decoration: none;
      font-weight: 600;
    }

    .chip-box {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .chip {
      padding: 7px 12px;
      background: #F3F4F6;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #E5E7EB;
      transition: all .15s ease;
    }

    .chip.selected {
      background: #10B981;
      color: white;
      border-color: #10B981;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo"></div>
    <div class="title">Create your profile</div>
    <div class="subtitle">Your allergies and dietary rules help us filter unsafe items.</div>

    <label>Name</label>
    <input id="name" placeholder="Your name" />

    <label>Email</label>
    <input id="email" placeholder="you@example.com" />

    <label>Password</label>
    <input id="password" type="password" placeholder="••••••••" />

    <label>Allergies</label>
    <div class="chip-box" id="allergyChips">
      <div class="chip" data-val="dairy">Dairy</div>
      <div class="chip" data-val="nuts">Nuts</div>
      <div class="chip" data-val="eggs">Eggs</div>
      <div class="chip" data-val="gluten">Gluten</div>
      <div class="chip" data-val="soy">Soy</div>
      <div class="chip" data-val="shellfish">Shellfish</div>
    </div>

    <label>Other restrictions</label>
    <textarea id="rules" rows="2" placeholder="Example: halal, low sugar, vegetarian"></textarea>

    <button class="btn" onclick="signup()">Create account</button>

    <div class="link">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>

<script>
document.querySelectorAll(".chip").forEach(c => {
  c.addEventListener("click", () => c.classList.toggle("selected"));
});

function signup() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const rulesRaw = document.getElementById("rules").value.trim();

  if (!name || !email || !password) {
    alert("Please fill all fields.");
    return;
  }

  const allergies = [...document.querySelectorAll(".chip.selected")]
    .map(c => c.dataset.val);

  const customRestrictions = rulesRaw
    ? rulesRaw.split(",").map(r => r.trim())
    : [];

  const user = { name, email, password, allergies, customRestrictions };

  localStorage.setItem("delivry_user", JSON.stringify(user));
  window.location.href = "login.html";
}
</script>
</body>
</html>
